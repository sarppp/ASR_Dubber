[project]
name = "cosyvoice-tts"
version = "0.1.0"
description = "Fun-CosyVoice3-0.5B TTS worker for the video dubbing pipeline"
readme = "README.md"
# CosyVoice pins deepspeed / torch 2.3.1, which need Python 3.10.
requires-python = ">=3.10,<3.11"

dependencies = [
    "torch==2.3.1",
    "torchaudio==2.3.1",
    # --- CosyVoice runtime deps (from CosyVoice/requirements.txt, minus
    #     tensorrt / deepspeed which are only needed for load_trt / training) ---
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "gdown==5.1.0",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "numpy<2.0",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime-gpu==1.18.0",
    "openai-whisper>=20240930",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "transformers==4.51.3",
    "x-transformers==2.11.24",
    "wetext==0.0.4",
    "wget==3.2",
    "huggingface-hub",
    # Matcha-TTS (CosyVoice/third_party/Matcha-TTS) extra deps not covered above
    "diffq",
    "einops",
    "modal",
]

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
# openai-whisper's sdist build imports pkg_resources; keep it out of an
# isolated build env that ships a pkg_resources-free setuptools.
no-build-isolation-package = ["openai-whisper"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
